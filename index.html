<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Student Result Checker</h1>
    <p>Check your academic results</p>
</header>
<main class="container">
    <h2>Check Result</h2>
    <label for="matric">Enter matric Number </label>

    <input
    type="text"
    id="matric"
    placeholder="e.g.ND/COM/001">

    <button onclick="checkResult()">CheckResult</button>

    <div id="result"></div>
</main>
<footer>
    <p>&copy; 2026 Student Result Checker</p>
</footer>

    <script src="script.js"></script>
</body>
</html>
